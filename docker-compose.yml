services:
  db:
    image: postgres:16
    environment: { POSTGRES_USER: ops, POSTGRES_PASSWORD: ops, POSTGRES_DB: ops }
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ops"]
      interval: 3s
      retries: 10
  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://ops:ops@db:5432/ops
    depends_on:
      db: { condition: service_healthy }
    ports: ["8000:8000"]
  frontend:
    build: ./frontend
    ports: ["8080:80"]
    depends_on: [backend]
volumes:
  pgdata: